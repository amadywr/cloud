# Nginx "server block" for website-vanilla.
# On the server this file is copied to /etc/nginx/sites-available/website-vanilla
# and switched on with a symlink in /etc/nginx/sites-enabled/.

server {
    # Listen for plain HTTP on port 80, for IPv4 and IPv6.
    # "default_server" = use this block for any request that arrives,
    # whatever hostname it asks for (we have no domain yet, only an IP).
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Folder on the server that holds the website files.
    root /var/www/website-vanilla/public;
    index index.html;

    location / {
        # Try the exact file, then a folder, otherwise return 404 Not Found.
        try_files $uri $uri/ =404;
    }

    # Step 1b adds a "location /api/" block here that forwards
    # API requests to Express on 127.0.0.1:3000 (the reverse proxy).
}
